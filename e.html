<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Functions</title>
</head>
<body>

<h1>Three Types of Functions</h1>

<button id="declaration">Function Declaration</button>
<button id="definition">Function Expression</button>
<button id="arrow">Arrow Function</button>

<p id="output"></p>

<script>
const output = document.getElementById("output");

function greetDeclaration() {
    output.innerText = "Hello from Function Declaration!";
}

const greetDefinition = function() {
    output.innerText = "Hello from Function Expression!";
};

const greetArrow = () => {
    output.innerText = "Hello from Arrow Function!";
};

document.getElementById("declaration").addEventListener("click", greetDeclaration);
document.getElementById("definition").addEventListener("click", greetDefinition);
document.getElementById("arrow").addEventListener("click", greetArrow);
</script>

</body>
</html>
