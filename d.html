<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Click Event</title>
</head>
<body>

<h1>Button Click Events</h1>

<button id="btn1" type="button">B.Tech III Year CSE</button>
<button id="btn2" type="button">Computer Science</button>
<button id="btn3" type="button">Full Stack Development</button>

<p id="output">Your selection will appear here.</p>

<script>
const output = document.getElementById("output");

document.getElementById("btn1").addEventListener("click", () => {
    output.textContent = "B.Tech III Year CSE";
});

document.getElementById("btn2").addEventListener("click", () => {
    output.textContent = "Computer Science and Engineering";
});

document.getElementById("btn3").addEventListener("click", () => {
    output.textContent = "Full Stack Development - II";
});
</script>

</body>
</html>
