<main>
<a href="index.html">&larr; All experiments</a>

<section>

<h1>Button Click Events</h1>

<button id="btn1" type="button">B.Tech III Year CSE</button>
<button id="btn2" type="button">Computer Science</button>
<button id="btn3" type="button">Full Stack Development</button>

<p id="output">Your selection will appear here.</p>

</section>
</main>

<script>

const output = document.getElementById("output");

document.getElementById("btn1").addEventListener("click", function () {
    output.innerText = "B.Tech III Year CSE";
});

document.getElementById("btn2").addEventListener("click", function () {
    output.innerText = "Computer Science and Engineering";
});

document.getElementById("btn3").addEventListener("click", function () {
    output.innerText = "Full Stack Development - II";
});

</script>

</body>
