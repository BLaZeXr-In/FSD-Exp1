<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Event Listeners | JavaScript Lab</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}nav{background:#222;padding:16px;text-align:center}nav a{color:#fff;margin:0 10px;text-decoration:none}main{max-width:850px;margin:48px auto;padding:0 20px}section{background:#fff;padding:28px;border:1px solid #ddd;border-radius:8px}button{padding:10px 16px;margin:8px 0}#hoverBox{width:200px;height:100px;background-color:lightblue;margin-top:20px;padding:12px}</style>
</head>
<body>
<nav aria-label="Main navigation"><a href="index.html">Home</a><a href="a.html">A: Linking</a><a href="b.html">B: Selectors</a><a href="c.html" aria-current="page">C: Events</a><a href="d.html">D: Buttons</a><a href="e.html">E: Functions</a></nav>
<main><a href="index.html">&larr; All experiments</a><section><h1>JavaScript Event Listeners</h1><button id="clickButton" type="button">Click Me</button><p id="message" aria-live="polite"></p><label for="textInput">Type something</label><br><input type="text" id="textInput" placeholder="Type something..."><p id="inputDisplay"></p><div id="hoverBox">Hover over this box</div></section></main>
<script>

document.getElementById("clickButton").addEventListener("click", function ()
{

document.getElementById("message").innerText = "Button clicked!";
});
document.getElementById("textInput").addEventListener("input", function (event) {
document.getElementById("inputDisplay").innerText = "You typed: " + event.target.value;
});

document.getElementById("hoverBox").addEventListener("mouseover", function ()
{
this.style.backgroundColor = "orange";
});

document.getElementById("hoverBox").addEventListener("mouseout", function ()
{
this.style.backgroundColor = "lightblue";
});
</script>
</body>
</html>
